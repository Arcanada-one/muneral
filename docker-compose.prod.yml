version: '3.9'
services:
  muneral-api:
    image: muneral-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        # A2-255: the commit the image is built from, so /health can name it (apps/api/src/build-info.ts).
        # BUILD_SHA is exported by the root deploy broker from its own checkout HEAD — a caller cannot
        # label an image with a commit it is not built from. It is EMPTY until muneral is listed in that
        # broker's BUILDSHA table (Arcanada-one/model-connector deploy/arcanada-compose-broker.sh:234,
        # which lists transcribator-api only as of 2026-09-24), and an empty value reports
        # build.sha: null with a reason rather than inventing one.
        MUNERAL_BUILD_SHA: ${BUILD_SHA:-}
    ports:
      - "127.0.0.1:3500:3500"
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3500/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MUN-0084: the web app. nginx (site muneral-app on arcana-prd) proxies app.muneral.com to
  # 127.0.0.1:3501; before this service existed nothing listened there and the edge answered 502.
  # Loopback bind ONLY (network-exposure-lint). It gets NO env_file: the API's .env holds database
  # and signing secrets the browser-facing web must not carry. The two variables below are
  # interpolated by name from the broker-installed root-owned .env, so only these two reach the
  # container (empty when the file does not define them - not_measured, see docs/how-to/activate-muneral-web.md).
  muneral-web:
    # PROFILE SWITCH (MUN-0084 PR-A): the broker runs `docker compose -p muneral -f docker-compose.prod.yml
    # build` / `up -d` with no service argument and no --profile, so a service under a profile is
    # neither built nor started by it. Merging this file therefore changes nothing on production;
    # muneral-api (the fleet task system) is untouched. PR-B removes this line to activate the web.
    profiles: [web]
    image: muneral-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Public by construction (inlined into the browser bundle); the API origin, no /api/v1.
        NEXT_PUBLIC_API_URL: https://api.muneral.com
    ports:
      - "127.0.0.1:3501:3501"
    environment:
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      AUTH_TRUST_HOST: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3501/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # muneral-worker: disabled — worker.js not yet implemented (MUN-0007+)
  # muneral-worker:
  #   image: muneral-api:latest
  #   command: ["node", "dist/worker.js"]
  #   env_file: .env
  #   restart: unless-stopped
