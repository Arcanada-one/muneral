# ============================================================
# Muneral Arcana — GitHub Actions CI/CD
# Fixed by DEVOPS-0001 (removed paid gitleaks-action, added deploy)
# Template: CI-Runners.md §10.1 adapted (pnpm + Turborepo)
# ============================================================

name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# BATCH-004: one concurrency group per PR number (or ref on non-PR). A newer push
# to the same PR cancels the superseded run. Non-PR events use github.ref and keep
# cancel-in-progress false, so main/deploy runs are never cancelled mid-flight.
# Job-level deploy locks are separate groups and are not touched.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets-gate:
    # TRANS-0029: fail-fast if OPSBOT_API_KEY is missing/empty. Without this
    # gate a deploy failure would silently no-op the Ops Bot notify curl
    # (empty Bearer token -> 401) and the incident would only surface when
    # someone noticed the missing alert. Pattern per TRANS-0027 (transcribator-api).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # A2-315: pre-deploy gates run on the dedicated `deploy-gate` lane, not on `ci-general`, where
    # KC2 batteries held all five slots for hours (argana 95 min, muneral 150 min in the queue on
    # 2026-09-24/25). The lane's runners carry ONLY that label (--no-default-labels): nothing else lands there.
    runs-on: [deploy-gate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Assert OPSBOT_API_KEY is set
        env:
          OPSBOT_API_KEY: ${{ secrets.OPSBOT_API_KEY }}
        run: bash scripts/ci/opsbot-secret-gate.sh

  tested-tree:
    # Reuse is an optimization only. Any missing, ambiguous or unqualified proof
    # emits `reuse=false`, so the ordinary lint-and-test job remains the fallback.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    runs-on: [self-hosted, linux, ci-general]
    outputs:
      reuse: ${{ steps.proof.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Qualify tested PR tree
        id: proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I scripts/ci/tested_tree.py

  lint-and-test:
    # This job remains successful on reuse so it cannot skip a transitive deploy
    # ancestor. The exact reuse proof runs while ordinary verification steps skip.
    # Dedicated deploy gates remain on their existing isolated lane.
    # BATCH-004 guard: ordinary (non-integration, unlabeled) PRs skip this job so
    # they do not occupy ci-general; required checks stay unset and block merge.
    runs-on: [self-hosted, linux, ci-general]
    needs: tested-tree
    if: >-
      always() && (
        github.event_name != 'pull_request' ||
        startsWith(github.head_ref, 'integration/') ||
        contains(github.event.pull_request.labels.*.name, 'ci:run')
      )
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: muneral_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # MUN: container port only -- Docker picks a free HOST port and
          # Actions publishes it as job.services.postgres.ports['5432'].
          # A fixed `5432:5432` died with "address already in use" before
          # any test ran: `ci-general` resolves to several runners and one
          # of them already serves Postgres on 5432. The job now runs
          # anywhere instead of only where that port happens to be free.
          - 5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Prepare reports directory
        if: needs.tested-tree.outputs.reuse != 'true'
        run: mkdir -p reports
      - name: Confirm tested-tree reuse proof
        run: printf 'tested-tree reuse=%s tree=%s\n' '${{ needs.tested-tree.outputs.reuse }}' "$(git rev-parse 'HEAD^{tree}')"
      - name: Test Ops Bot secret gate contract
        id: opsbot_secret_gate_test
        if: needs.tested-tree.outputs.reuse != 'true'
        continue-on-error: true
        run: bash scripts/ci/opsbot-secret-gate.test.sh
      - name: Test runner deploy-broker preflight contract
        id: runner_broker_preflight_test
        if: needs.tested-tree.outputs.reuse != 'true'
        continue-on-error: true
        run: bash scripts/ci/runner-broker-preflight.test.sh
      - name: Test tested-tree reuse qualification
        id: tested_tree_unit
        if: needs.tested-tree.outputs.reuse != 'true'
        continue-on-error: true
        run: python3 -I scripts/ci/test_tested_tree.py
      - name: Test semantic aggregate readback contract
        id: semantic_readback_contract
        if: needs.tested-tree.outputs.reuse != 'true'
        continue-on-error: true
        run: |
          node --test apps/api/scripts/semantic-aggregate-readback.test.mjs
          node --test apps/api/scripts/run-jest-isolated.test.mjs
          bash scripts/ci/semantic-readback-caller-contract.test.sh
      # A2-255: the endpoint probes are a verifier, so they need a verifier of their own. This runs
      # scripts/probe-endpoints.sh against a loopback stub that serves deliberately broken /health
      # bodies and asserts each one goes RED — including the exact hole A2-251 measured, where the
      # controller's `0.0.0-unknown` sentinel was recorded as a valid version.
      - name: Test /health identity probes go red on a build that cannot name itself
        id: health_identity_probe_test
        if: needs.tested-tree.outputs.reuse != 'true'
        continue-on-error: true
        run: bash scripts/ci/probe-health-identity.test.sh
      # A2-267: the agent-task list must carry `contractDigest` on every row. This serves rows with
      # the key missing or malformed from a loopback stub and asserts the probe goes RED on each.
      - name: Test the contract-digest probe goes red on a build without the field
        id: contract_digest_probe_test
        if: needs.tested-tree.outputs.reuse != 'true'
        continue-on-error: true
        run: bash scripts/ci/probe-contract-digest.test.sh
      # A2-330: the post-deploy canary must be able to go red — a route missing from the resident
      # route table, a 405, a router no-match 404 — and must never send anything but a GET.
      - name: Test the post-deploy canary goes red
        id: canary_red_test
        if: needs.tested-tree.outputs.reuse != 'true'
        continue-on-error: true
        run: python3 -m unittest discover -s scripts/canary -p 'test_*.py'
      - name: Enable corepack (pnpm@11.5.2 from packageManager field)
        if: needs.tested-tree.outputs.reuse != 'true'
        run: |
          COREPACK_HOME="${RUNNER_TEMP}/corepack-bin"
          mkdir -p "${COREPACK_HOME}"
          corepack enable --install-directory "${COREPACK_HOME}"
          echo "${COREPACK_HOME}" >> "${GITHUB_PATH}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        if: needs.tested-tree.outputs.reuse != 'true'
        with:
          node-version: 26.13.0
          cache: pnpm
      - name: Test standalone browser stderr sanitizer
        id: sanitize_browser_stderr_test
        if: needs.tested-tree.outputs.reuse != 'true'
        continue-on-error: true
        run: node --test scripts/diagnostics/sanitize-browser-stderr.test.mjs
      - name: Install dependencies
        if: needs.tested-tree.outputs.reuse != 'true'
        run: pnpm install --frozen-lockfile
      # BATCH-004 machine reports: continue-on-error so one failure does not hide the rest.
      # `collect` below is the sole step that turns prior check outcomes into a red job.
      - name: ESLint machine report
        id: eslint
        if: needs.tested-tree.outputs.reuse != 'true'
        continue-on-error: true
        run: |
          set +e
          mkdir -p reports
          # Combine api + web eslint JSON arrays into reports/eslint.json
          pnpm --filter @muneral/api exec eslint src --ext .ts -f json -o ../../reports/eslint-api.json
          api_rc=$?
          pnpm --filter @muneral/web exec eslint . -f json -o ../../reports/eslint-web.json
          web_rc=$?
          python3 - <<'PY'
          import json
          from pathlib import Path
          parts = []
          for name in ("reports/eslint-api.json", "reports/eslint-web.json"):
              p = Path(name)
              if not p.is_file() or p.stat().st_size == 0:
                  continue
              try:
                  data = json.loads(p.read_text())
              except json.JSONDecodeError:
                  continue
              if isinstance(data, list):
                  parts.extend(data)
              else:
                  parts.append(data)
          Path("reports/eslint.json").write_text(json.dumps(parts, indent=2) + "\n")
          PY
          if [ "${api_rc}" -ne 0 ] || [ "${web_rc}" -ne 0 ]; then exit 1; fi
          exit 0
      - name: Build shared types
        id: build_types
        if: needs.tested-tree.outputs.reuse != 'true'
        continue-on-error: true
        run: pnpm --filter @muneral/types build
      - name: Generate Prisma client
        if: needs.tested-tree.outputs.reuse != 'true'
        # Run from repo root so prisma.config.ts (root) resolves apps/api/prisma/schema.prisma
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/muneral_test
      # tsc report MUST follow prisma generate — otherwise @prisma/client has no generated exports.
      - name: TypeScript machine report
        id: tsc
        if: needs.tested-tree.outputs.reuse != 'true'
        continue-on-error: true
        run: |
          set +e
          mkdir -p reports
          {
            printf '=== @muneral/types ===\n'
            pnpm --filter @muneral/types exec tsc --pretty false
            types_rc=$?
            printf '=== @muneral/api ===\n'
            pnpm --filter @muneral/api exec tsc -p tsconfig.json --pretty false --noEmit
            api_rc=$?
            if [ "${types_rc}" -ne 0 ] || [ "${api_rc}" -ne 0 ]; then exit 1; fi
            exit 0
          } > reports/tsc.txt 2>&1
      - name: Build
        id: build
        if: needs.tested-tree.outputs.reuse != 'true'
        continue-on-error: true
        run: pnpm build
      - name: Apply DB migrations
        if: needs.tested-tree.outputs.reuse != 'true'
        # Run from repo root — prisma.config.ts at root, schema at apps/api/prisma/schema.prisma
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/muneral_test
      - name: Test semantic aggregate readback against disposable PostgreSQL
        id: semantic_readback_db
        if: needs.tested-tree.outputs.reuse != 'true'
        continue-on-error: true
        run: node apps/api/scripts/semantic-aggregate-readback.mjs
        env:
          DATABASE_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/muneral_test
      - name: Jest machine report
        id: jest
        if: needs.tested-tree.outputs.reuse != 'true'
        continue-on-error: true
        run: |
          mkdir -p reports
          # No --bail: collect every failure into the JSON report.
          NODE_OPTIONS=--experimental-vm-modules \
            pnpm --filter @muneral/api exec node scripts/run-jest-isolated.mjs --min-test-files 100 --json --outputFile ../../reports/jest.json
        env:
          DATABASE_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/muneral_test
          MUN0020_DB_URL: postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/muneral_test
      - name: Vitest machine report
        id: vitest
        if: needs.tested-tree.outputs.reuse != 'true'
        continue-on-error: true
        run: |
          mkdir -p reports
          pnpm --filter @muneral/web exec vitest run --reporter=json --outputFile ../../reports/vitest.json
      - name: Verify structure machine report
        id: verify_structure
        if: needs.tested-tree.outputs.reuse != 'true'
        continue-on-error: true
        run: |
          mkdir -p reports
          bash scripts/ci/verify-structure.sh > reports/verify-structure.txt 2>&1
      - name: Collect ErrorLedger
        id: collect
        if: always() && needs.tested-tree.outputs.reuse != 'true'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          mkdir -p reports "${RUNNER_TEMP}/error-ledger"
          cat > "${RUNNER_TEMP}/error-ledger/step-outcomes.txt" <<'EOF'
          opsbot_secret_gate_test=${{ steps.opsbot_secret_gate_test.outcome }}
          runner_broker_preflight_test=${{ steps.runner_broker_preflight_test.outcome }}
          tested_tree_unit=${{ steps.tested_tree_unit.outcome }}
          semantic_readback_contract=${{ steps.semantic_readback_contract.outcome }}
          health_identity_probe_test=${{ steps.health_identity_probe_test.outcome }}
          contract_digest_probe_test=${{ steps.contract_digest_probe_test.outcome }}
          canary_red_test=${{ steps.canary_red_test.outcome }}
          sanitize_browser_stderr_test=${{ steps.sanitize_browser_stderr_test.outcome }}
          eslint=${{ steps.eslint.outcome }}
          tsc=${{ steps.tsc.outcome }}
          build_types=${{ steps.build_types.outcome }}
          build=${{ steps.build.outcome }}
          semantic_readback_db=${{ steps.semantic_readback_db.outcome }}
          jest=${{ steps.jest.outcome }}
          vitest=${{ steps.vitest.outcome }}
          verify_structure=${{ steps.verify_structure.outcome }}
          EOF
          python3 - <<'PY' > "${RUNNER_TEMP}/error-ledger/run-meta.json"
          import json
          import os
          print(json.dumps({
            "repository": """${{ github.repository }}""",
            "run_id": """${{ github.run_id }}""",
            "run_attempt": """${{ github.run_attempt }}""",
            "sha": """${{ github.sha }}""",
            "ref": """${{ github.ref }}""",
            "event_name": """${{ github.event_name }}""",
            "head_ref": os.environ["HEAD_REF"],
          }))
          PY
          summary_args=()
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            summary_args=(--summary-file "${GITHUB_STEP_SUMMARY}")
          fi
          python3 -I scripts/ci/collect-error-ledger.py \
            --step-outcomes-file "${RUNNER_TEMP}/error-ledger/step-outcomes.txt" \
            --run-meta-file "${RUNNER_TEMP}/error-ledger/run-meta.json" \
            --out reports/error-ledger.json \
            "${summary_args[@]}"
      - name: Upload ErrorLedger artifact
        if: always() && needs.tested-tree.outputs.reuse != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: error-ledger-${{ github.sha }}
          path: |
            reports/error-ledger.json
            reports/eslint.json
            reports/tsc.txt
            reports/jest.json
            reports/vitest.json
            reports/verify-structure.txt
          if-no-files-found: warn

  # AUP-GRAPH-006 `gate1` (DEC-AUP-0008): «нет receipt — нет мержа». A pull request is admitted only
  # when a ChangeAdmissionReceipt/v1 is bound to exactly this change range — in the head tree under
  # receipts/graph/, or as a ```json block in the pull-request body. Doc-only changes report
  # `not_measured` and stay green; a missing, unbound, stale or two-valued receipt is red.
  # `program_ref` MUST be the same SHA as the `uses:` ref and as .github/graph-admission/BUNDLE.json
  # (the gate tools travel as a digest-pinned vendored bundle: the program repository is private, so a
  # cross-repo checkout would need a credential this rule does not create). DEC-AUP-0007 keeps CI
  # post-hoc: the authoritative run is the local `admit_change.py gate` of the agent that changed the code.
  graph-admission:
    permissions:
      contents: read
      actions: read
    # Pull requests only: this gate is about MERGES. On a push to main there is no pull-request body
    # to read a receipt from, and `deploy` must not gain a dependency that is skipped there (a skipped
    # need skips the dependent). "Required for merge" is enforced where it belongs — as a required
    # status check on `main` in branch protection.
    #
    # AUP-GRAPH-006:gate2a. `needs: lint-and-test` + `if: always()` is what makes the automated-author
    # path honest. A dependency-manifest or lockfile change triggers the graph's global fallback — the
    # blast radius is the WHOLE repository (the Bazel/Nx rule of DEC-AUP-0008) — and the verifier for
    # that is this repository's own suite. So the gate is handed `needs.lint-and-test.result`, and it
    # maps success -> verified, failure/cancelled/timed_out -> failed, anything else -> not_measured.
    # `always()` is required for the gate to SEE a failure: without it a failed need would skip this
    # job, and a skipped check is not a red one. `deploy` does not depend on this job, so its
    # dependency graph is unchanged.
    needs: lint-and-test
    if: always() && github.event_name == 'pull_request'
    # The workflow file is the program repository's own, vendored byte-for-byte from the pinned SHA
    # below (its sha256 is recorded in .github/graph-admission/BUNDLE.json). It is called LOCALLY
    # because the cross-repository reference to the reusable workflow of the PRIVATE program
    # repository does not start a run here — GitHub reports only "workflow file issue", with no job
    # and no retrievable annotation. Recorded as a hole, not as a solved problem.
    uses: ./.github/workflows/graph-admission.yml
    with:
      program_ref: 'cc3307df92348433ab6fbc2f34a12597d9fefeb7'
      stage_evidence_path: ''
      stage_evidence_root: ''
      stage_evidence_required: false
      verifier_job: 'lint-and-test'
      verifier_conclusion: ${{ needs.lint-and-test.result }}
      # AUP-GRAPH-006:gate2b. The fingerprint of the Ed25519 key that signs the vendored bundle's
      # BUNDLE.json. It lives HERE, in this repository's own workflow file, deliberately OUTSIDE
      # .github/graph-admission/: a fingerprint kept inside the bundle would be replaced by the very
      # change that replaces the key, and would prove only that the bundle agrees with itself. With
      # it, a tamper re-signed by an attacker's own key is refused; without it the gate reports
      # BUNDLE_SIGNATURE_UNPINNED as `not_measured`, which is never a pass.
      signing_key_fingerprint: 'SHA256:9QFqysn44UjA8rXyfHjItP3b2Oadhnbf1bDNqXrsCig'

  network-exposure:
    # BATCH-004 guard: skip unlabeled non-integration PRs (do not occupy ci-general).
    if: >-
      github.event_name != 'pull_request' ||
      startsWith(github.head_ref, 'integration/') ||
      contains(github.event.pull_request.labels.*.name, 'ci:run')
    uses: Arcanada-one/datarim/.github/workflows/network-exposure-lint.yml@1fbb6bd89202b032f4ef9b9a6de4b186d9cf316c
    with:
      compose_paths: docker-compose.prod.yml
      datarim_ref: '1fbb6bd89202b032f4ef9b9a6de4b186d9cf316c'
      # A2-315: on the deploying push this gate takes the `deploy-gate` lane too (default is ci-general).
      runner_labels: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && '["deploy-gate"]' || '["self-hosted","linux","ci-general"]' }}

  preflight-caller-contract:
    # BATCH-004 guard: same PR skip rule as lint-and-test / network-exposure.
    # Job stays on ubuntu-latest (not ci-general). Required `if:` restored for AC3;
    # capabilities allowlist in pinned datarim preflight-caller-contract is unchanged
    # (no deploy/vault/contract-step weakening).
    if: >-
      github.event_name != 'pull_request' ||
      startsWith(github.head_ref, 'integration/') ||
      contains(github.event.pull_request.labels.*.name, 'ci:run')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - uses: Arcanada-one/datarim/.github/actions/preflight-caller-contract@1fbb6bd89202b032f4ef9b9a6de4b186d9cf316c
        with:
          vault-addr: ${{ vars.VAULT_ADDR }}

  deploy-readiness:
    # Keep the registered deploy.if byte-for-byte exact. This capability-free
    # aggregator is the conditional DAG edge: only an exact reuse proof or a
    # successful cold suite, plus every security gate, can reach the deploy job.
    needs: [tested-tree, lint-and-test, secrets-gate, network-exposure, preflight-caller-contract]
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, linux, ci-general]
    permissions: {}
    steps:
      - name: Require successful test proof and security gates
        env:
          TESTED_TREE_RESULT: ${{ needs.tested-tree.result }}
          TESTED_TREE_REUSE: ${{ needs.tested-tree.outputs.reuse }}
          LINT_AND_TEST_RESULT: ${{ needs.lint-and-test.result }}
          SECRETS_GATE_RESULT: ${{ needs.secrets-gate.result }}
          NETWORK_EXPOSURE_RESULT: ${{ needs.network-exposure.result }}
          PREFLIGHT_CONTRACT_RESULT: ${{ needs.preflight-caller-contract.result }}
        run: |
          set -eu
          [ "$TESTED_TREE_RESULT" = success ]
          if [ "$TESTED_TREE_REUSE" = true ]; then
            [ "$LINT_AND_TEST_RESULT" = success ]
          else
            [ "$LINT_AND_TEST_RESULT" = success ]
          fi
          [ "$SECRETS_GATE_RESULT" = success ]
          [ "$NETWORK_EXPOSURE_RESULT" = success ]
          [ "$PREFLIGHT_CONTRACT_RESULT" = success ]

  deploy:
    needs: [deploy-readiness, preflight-caller-contract]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # SEC-0063: a HOST-UNIQUE label, not the shared `arcana-prod`. The shared
    # label sits on several runners, including ones on a DIFFERENT machine
    # where this service has no containers and the root deploy broker has no
    # row for it. Landing there fails inside the deploy at best, and builds a
    # second empty stack that reports success at worst.
    #
    # INFRA-0417 (2026-09-16) consolidated three machines onto arcana-prd, so
    # the host-unique label this deploy targets moved from `arcana-prod-host`
    # (-> the old arcana-prod, being decommissioned) to `arcana-prd-host`
    # (-> arcana-prd). Both are single-holder by construction: switching the
    # label is how a service moves between hosts, one service at a time.
    # muneral's Postgres and Redis are external (arcana-dbs over the mesh),
    # so the move carries no local state.
    runs-on: [self-hosted, linux, arcana-prd-host]
    concurrency:
      group: deploy-muneral
      cancel-in-progress: false
    env:
      VAULT_ADDR: ${{ vars.VAULT_ADDR }}
    steps:
      - name: Pre-deploy host readiness
        id: preflight
        uses: Arcanada-one/datarim/.github/actions/preflight-check@1fbb6bd89202b032f4ef9b9a6de4b186d9cf316c
        with:
          target-host: arcana-prd
          service-name: muneral
          # `docker-pressure` is deliberately absent: it shells out to
          # `docker system df`, which this runner is losing access to on
          # purpose, and the check degrades to a permanent warning rather than
          # to silence. Disk pressure on /var/lib/docker is still covered by
          # the mandatory disk check, which only needs `df`.
          extra-checks: |
            vault
            tailscale
            time-skew
          ops-bot-emit: "true"
          ops-bot-agent: muneral
          ops-bot-key: ${{ secrets.OPSBOT_API_KEY }}
          ops-bot-url: https://ops.arcanada.ai/events
          allowed_hosts: ops.arcanada.ai

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # SEC-0028: the previous check asserted this runner *is* in the host
      # `docker` group. That group is root-equivalent on a host that also
      # carries the Control Arcana root deploy broker, so the check gated on
      # the presence of the escalation being removed.
      - name: Verify deploy-broker capability
        run: bash scripts/ci/runner-broker-preflight.sh

      # Every step below hands the broker a service name and a commit SHA and
      # nothing else. The broker refuses any SHA not already reachable from
      # origin/main, works from its own root-owned checkout, and supplies the
      # container environment from a root-owned file this runner cannot read
      # or write.
      - name: Sync broker checkout to this commit
        if: steps.preflight.outputs.status != 'fail'
        run: sudo -n /usr/local/sbin/arcanada-compose-broker muneral sync "$GITHUB_SHA"

      - name: Apply database migrations
        if: steps.preflight.outputs.status != 'fail'
        run: sudo -n /usr/local/sbin/arcanada-compose-broker muneral migrate

      - name: Build image
        if: steps.preflight.outputs.status != 'fail'
        run: sudo -n /usr/local/sbin/arcanada-compose-broker muneral build

      - name: Bring up stack
        if: steps.preflight.outputs.status != 'fail'
        run: sudo -n /usr/local/sbin/arcanada-compose-broker muneral up

      - name: Wait for healthy
        if: steps.preflight.outputs.status != 'fail'
        run: |
          set -e
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3500/health > /dev/null 2>&1; then
              echo "muneral healthy on attempt $i"
              # A2-255: print WHICH build answered. `build.sha` is baked into the image from
              # ${BUILD_SHA:-} (apps/api/src/build-info.ts); when the deploy broker does not export
              # BUILD_SHA for muneral it is null WITH a reason, and this log line is where that gap
              # is visible instead of invisible. Informational on purpose — it is not yet a gate,
              # because a gate that cannot pass would be a red that teaches people to ignore reds.
              echo "muneral /health says: $(curl -fsS http://localhost:3500/health)"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed after 100s"
          sudo -n /usr/local/sbin/arcanada-compose-broker muneral logs 100
          exit 1

      # A2-330: the post-deploy canary (observed-edges-and-deploy-gate.v1 rules C1/C3/C5). The program's
      # admission policy lists muneral under decision_exemptions.no_live_contour.live_contours, so an
      # inferred boundary here is lifted by running this, never by an exemption. Route presence is
      # read from the RESIDENT process's own route table (/health/routes) and the router's no-match
      # fingerprint, never from a status code; a 405 is a refusal. GET only, no body, no credential:
      # nothing here writes. `-I` keeps scripts/canary/ off the import path (scrutator A2-329).
      - name: Post-deploy canary
        id: canary
        if: steps.preflight.outputs.status != 'fail'
        run: |
          set -uo pipefail
          mkdir -p "${RUNNER_TEMP}/canary"
          rc=0
          python3 -I scripts/canary/canary_probe.py \
            --plan deploy/canary/muneral-route-presence.plan.json \
            --phase post --base-url http://127.0.0.1:3500 --repo . \
            --out "${RUNNER_TEMP}/canary/muneral-route-presence-post.json" || rc=$?
          # Recorded, not raised here, so the result is uploaded before the verdict fails the run
          # (every deploy step carries the same preflight `if:`; see preflight-caller-contract).
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"

      - name: Keep the canary result
        if: steps.preflight.outputs.status != 'fail'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: canary-post-${{ github.sha }}
          path: ${{ runner.temp }}/canary/
          if-no-files-found: error

      # 0 = every entity verified; 3 = some not_measured (absence of measurement, rule C3: not a
      # regression, never a pass); 1 = a measured failure; 2 = the plan was refused.
      - name: Canary verdict
        if: steps.preflight.outputs.status != 'fail'
        env:
          CANARY_RC: ${{ steps.canary.outputs.rc }}
        run: |
          case "${CANARY_RC}" in
            0) echo "canary: every entity verified" ;;
            3) echo "::warning title=canary::some entities not_measured (rule C3)" ;;
            *) echo "::error title=canary::canary rc=${CANARY_RC:-missing}: a failed entity or a refused plan"; exit 1 ;;
          esac

      - name: Semantic aggregate readback
        if: steps.preflight.outputs.status != 'fail'
        run: sudo -n /usr/local/sbin/arcanada-compose-broker muneral aggregate-readback

      - name: Status snapshot
        if: steps.preflight.outputs.status != 'fail'
        run: sudo -n /usr/local/sbin/arcanada-compose-broker muneral ps

  notify-deploy-failure:
    needs: deploy
    if: always() && needs.deploy.result == 'failure'
    # A2-384: NOT on the `deploy-gate` lane. This job gates nothing and deploys nothing, and the lane
    # runs on arcana-prd, the same host as `deploy` (`arcana-prd-host`): the one failure it most has to
    # report (arcana-prd gone, taking the deploy runner with it) would take the lane down with it and
    # the alert would queue forever. `ci-general` spans two hosts (arcana-devs and arcana-prd), so it
    # still fires; the cost is that it can wait behind a KC2 battery. A late alert beats a lost one.
    runs-on: [self-hosted, linux, ci-general]
    steps:
      - name: Notify Ops Bot on deploy failure
        run: |
          curl -fsS -X POST https://ops.arcanada.ai/events \
            -H "Authorization: Bearer ${{ secrets.OPSBOT_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"category":"fatal","agent":"muneral","title":"CI Deploy Failed: ${{ github.repository }}","body":"Branch: ${{ github.ref }}, Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}","dedup_key":"ci-fail-${{ github.repository }}-${{ github.run_id }}"}'
