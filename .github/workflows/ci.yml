# ============================================================
# Muneral Arcana — GitHub Actions CI/CD
# Fixed by DEVOPS-0001 (removed paid gitleaks-action, added deploy)
# Template: CI-Runners.md §10.1 adapted (pnpm + Turborepo)
# ============================================================

name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets-gate:
    # TRANS-0029: fail-fast if OPSBOT_API_KEY is missing/empty. Without this
    # gate a deploy failure would silently no-op the Ops Bot notify curl
    # (empty Bearer token -> 401) and the incident would only surface when
    # someone noticed the missing alert. Pattern per TRANS-0027 (transcribator-api).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, ci-general]
    steps:
      - name: Assert OPSBOT_API_KEY is set
        env:
          OPSBOT_API_KEY: ${{ secrets.OPSBOT_API_KEY }}
        run: |
          if [ -z "${OPSBOT_API_KEY:-}" ]; then
            echo "::error::OPSBOT_API_KEY secret is missing or empty — alerting path to ops.arcanada.one would silently fail. Restore via OpsBot CLI (\`agent register --name muneral\`) and \`gh secret set OPSBOT_API_KEY --repo Arcanada-one/muneral\`."
            exit 1
          fi
          echo "OPSBOT_API_KEY present (length=${#OPSBOT_API_KEY})."

  lint-and-test:
    runs-on: [self-hosted, linux, ci-general]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: muneral_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Enable corepack (pnpm@11.5.2 from packageManager field)
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared types
        run: pnpm --filter @muneral/types build
      - name: Generate Prisma client
        # Run from repo root so prisma.config.ts (root) resolves apps/api/prisma/schema.prisma
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/muneral_test
      - name: Apply DB migrations
        # Run from repo root — prisma.config.ts at root, schema at apps/api/prisma/schema.prisma
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/muneral_test
      - name: Test API
        run: pnpm --filter @muneral/api test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/muneral_test

  network-exposure:
    uses: Arcanada-one/datarim/.github/workflows/network-exposure-lint.yml@57afdfcd6a2d71aa8e0b577de6e43846e93b60dd
    with:
      compose_paths: docker-compose.prod.yml
      datarim_ref: '57afdfcd6a2d71aa8e0b577de6e43846e93b60dd'

  deploy:
    needs: [lint-and-test, secrets-gate, network-exposure]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, linux, arcana-prod]
    concurrency:
      group: deploy-muneral
      cancel-in-progress: false
    steps:
      - name: Pre-deploy host readiness
        id: preflight
        uses: Arcanada-one/datarim/.github/actions/preflight-check@f01ab2034ee99321fe627b76e98641b672e12c0b # v1, immutable pin
        with:
          target-host: arcana-prod
          service-name: muneral
          extra-checks: |
            vault
            tailscale
            time-skew
            docker-pressure
          ops-bot-key: ${{ secrets.OPSBOT_API_KEY }}

      - name: Deploy
        if: steps.preflight.outputs.status != 'fail'
        run: |
          set -e
          cd /srv/apps/muneral
          git pull --ff-only origin main
          # Apply schema migrations before starting the new image.
          # prisma.config.ts lives at repo root; migrate deploy resolves the
          # schema path and DATABASE_URL from the .env file in this directory.
          set -o allexport && source .env && set +o allexport
          # Run from repo root so prisma.config.ts resolves schema + DATABASE_URL
          pnpm exec prisma migrate deploy
          docker compose -f docker-compose.prod.yml up -d --build
          sleep 10
          curl -fsS http://localhost:3500/health
          echo "Deploy OK: $(docker compose -f docker-compose.prod.yml ps --format '{{.Name}} {{.Status}}')"

      - name: Notify Ops Bot on failure
        if: failure()
        run: |
          curl -fsS -X POST https://ops.arcanada.ai/events \
            -H "Authorization: Bearer ${{ secrets.OPSBOT_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"category":"fatal","agent":"muneral","title":"CI Deploy Failed: ${{ github.repository }}","body":"Branch: ${{ github.ref }}, Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}","dedup_key":"ci-fail-${{ github.repository }}-${{ github.run_id }}"}'
