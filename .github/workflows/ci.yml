# ============================================================
# Muneral Arcana — GitHub Actions CI/CD
# Fixed by DEVOPS-0001 (removed paid gitleaks-action, added deploy)
# Template: CI-Runners.md §10.1 adapted (pnpm + Turborepo)
# ============================================================

name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets-gate:
    # TRANS-0029: fail-fast if OPSBOT_API_KEY is missing/empty. Without this
    # gate a deploy failure would silently no-op the Ops Bot notify curl
    # (empty Bearer token -> 401) and the incident would only surface when
    # someone noticed the missing alert. Pattern per TRANS-0027 (transcribator-api).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, ci-general]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Assert OPSBOT_API_KEY is set
        env:
          OPSBOT_API_KEY: ${{ secrets.OPSBOT_API_KEY }}
        run: bash scripts/ci/opsbot-secret-gate.sh

  lint-and-test:
    runs-on: [self-hosted, linux, ci-general]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: muneral_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Test Ops Bot secret gate contract
        run: bash scripts/ci/opsbot-secret-gate.test.sh
      - name: Test runner deploy-broker preflight contract
        run: bash scripts/ci/runner-broker-preflight.test.sh
      - name: Enable corepack (pnpm@11.5.2 from packageManager field)
        run: |
          COREPACK_HOME="${RUNNER_TEMP}/corepack-bin"
          mkdir -p "${COREPACK_HOME}"
          corepack enable --install-directory "${COREPACK_HOME}"
          echo "${COREPACK_HOME}" >> "${GITHUB_PATH}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build shared types
        run: pnpm --filter @muneral/types build
      - name: Generate Prisma client
        # Run from repo root so prisma.config.ts (root) resolves apps/api/prisma/schema.prisma
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/muneral_test
      - name: Build
        run: pnpm build
      - name: Apply DB migrations
        # Run from repo root — prisma.config.ts at root, schema at apps/api/prisma/schema.prisma
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/muneral_test
      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/muneral_test
          MUN0020_DB_URL: postgresql://test:test@localhost:5432/muneral_test

  network-exposure:
    uses: Arcanada-one/datarim/.github/workflows/network-exposure-lint.yml@57afdfcd6a2d71aa8e0b577de6e43846e93b60dd
    with:
      compose_paths: docker-compose.prod.yml
      datarim_ref: '57afdfcd6a2d71aa8e0b577de6e43846e93b60dd'

  deploy:
    needs: [lint-and-test, secrets-gate, network-exposure]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, linux, arcana-prod]
    concurrency:
      group: deploy-muneral
      cancel-in-progress: false
    env:
      VAULT_ADDR: ${{ vars.VAULT_ADDR }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # SEC-0028: the previous check asserted this runner *is* in the host
      # `docker` group. That group is root-equivalent on a host that also
      # carries the Control Arcana root deploy broker, so the check gated on
      # the presence of the escalation being removed.
      - name: Verify deploy-broker capability
        run: bash scripts/ci/runner-broker-preflight.sh

      - name: Pre-deploy host readiness
        id: preflight
        uses: Arcanada-one/datarim/.github/actions/preflight-check@f01ab2034ee99321fe627b76e98641b672e12c0b  # v1, immutable pin
        with:
          target-host: arcana-prod
          service-name: muneral
          # `docker-pressure` is deliberately absent: it shells out to
          # `docker system df`, which this runner is losing access to on
          # purpose, and the check degrades to a permanent warning rather than
          # to silence. Disk pressure on /var/lib/docker is still covered by
          # the mandatory disk check, which only needs `df`.
          extra-checks: |
            vault
            tailscale
            time-skew
          ops-bot-key: ${{ secrets.OPSBOT_API_KEY }}

      # Every step below hands the broker a service name and a commit SHA and
      # nothing else. The broker refuses any SHA not already reachable from
      # origin/main, works from its own root-owned checkout, and supplies the
      # container environment from a root-owned file this runner cannot read
      # or write.
      - name: Sync broker checkout to this commit
        if: steps.preflight.outputs.status != 'fail'
        run: sudo -n /usr/local/sbin/arcanada-compose-broker muneral sync "$GITHUB_SHA"

      - name: Apply database migrations
        if: steps.preflight.outputs.status != 'fail'
        run: sudo -n /usr/local/sbin/arcanada-compose-broker muneral migrate

      - name: Build image
        if: steps.preflight.outputs.status != 'fail'
        run: sudo -n /usr/local/sbin/arcanada-compose-broker muneral build

      - name: Bring up stack
        if: steps.preflight.outputs.status != 'fail'
        run: sudo -n /usr/local/sbin/arcanada-compose-broker muneral up

      - name: Wait for healthy
        if: steps.preflight.outputs.status != 'fail'
        run: |
          set -e
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3500/health > /dev/null 2>&1; then
              echo "muneral healthy on attempt $i"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed after 100s"
          sudo -n /usr/local/sbin/arcanada-compose-broker muneral logs 100
          exit 1

      - name: Status snapshot
        if: steps.preflight.outputs.status != 'fail'
        run: sudo -n /usr/local/sbin/arcanada-compose-broker muneral ps

      - name: Notify Ops Bot on failure
        if: failure()
        run: |
          curl -fsS -X POST https://ops.arcanada.ai/events \
            -H "Authorization: Bearer ${{ secrets.OPSBOT_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"category":"fatal","agent":"muneral","title":"CI Deploy Failed: ${{ github.repository }}","body":"Branch: ${{ github.ref }}, Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}","dedup_key":"ci-fail-${{ github.repository }}-${{ github.run_id }}"}'
