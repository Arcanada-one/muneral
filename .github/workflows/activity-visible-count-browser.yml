name: Activity visible count browser path

on:
  pull_request:
    paths:
      - '.github/workflows/activity-visible-count-browser.yml'
      - 'apps/web/components/task/AuditLog.tsx'
      - 'apps/web/components/ui/**'
      - 'apps/web/lib/api/**'
      - 'apps/web/e2e/activity-visible-count/**'
      - 'apps/web/package.json'
      - 'apps/web/vite.config.*'
      - 'packages/types/package.json'
      - 'packages/types/src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

jobs:
  activity-visible-count-browser:
    # This named runner class provides the root-managed CfT binary under AppArmor.
    runs-on: [self-hosted, linux, ci-general]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1

      - name: Enable the repository-pinned pnpm
        run: |
          set -euo pipefail
          corepack_home="${RUNNER_TEMP}/activity-visible-count-corepack"
          mkdir -m 700 "${corepack_home}"
          corepack enable --install-directory "${corepack_home}"
          printf '%s\n' "${corepack_home}" >> "${GITHUB_PATH}"

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run inert fixture and failure-summary source controls
        run: node --test apps/web/e2e/activity-visible-count/source.test.mjs apps/web/e2e/activity-visible-count/failure-summary.test.mjs

      - name: Allocate fresh candidate-bound output and private roots
        id: allocate-output
        env:
          ACTIVITY_COUNT_RUN_ID: ${{ github.run_id }}
          ACTIVITY_COUNT_RUN_ATTEMPT: ${{ github.run_attempt }}
          ACTIVITY_COUNT_CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          [[ "${ACTIVITY_COUNT_RUN_ID}" =~ ^[0-9]+$ ]]
          [[ "${ACTIVITY_COUNT_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          [[ "${ACTIVITY_COUNT_CANDIDATE_SHA}" =~ ^[a-f0-9]{40}$ ]]
          artifact_parent="${RUNNER_TEMP}/activity-visible-count-artifacts/${ACTIVITY_COUNT_RUN_ID}/${ACTIVITY_COUNT_RUN_ATTEMPT}"
          private_parent="${RUNNER_TEMP}/activity-visible-count-private/${ACTIVITY_COUNT_RUN_ID}/${ACTIVITY_COUNT_RUN_ATTEMPT}"
          mkdir -p "${artifact_parent}" "${private_parent}"
          artifact_root="${artifact_parent}/${ACTIVITY_COUNT_CANDIDATE_SHA}"
          private_root="${private_parent}/${ACTIVITY_COUNT_CANDIDATE_SHA}"
          mkdir -m 700 "${artifact_root}"
          mkdir -m 700 "${private_root}"
          {
            printf 'artifact_root=%s\n' "${artifact_root}"
            printf 'private_root=%s\n' "${private_root}"
            printf 'ready=true\n'
          } >> "${GITHUB_OUTPUT}"

      - name: Run the current-page activity count browser path
        if: steps.allocate-output.outputs.ready == 'true'
        timeout-minutes: 5
        env:
          CHROME_PATH: /opt/arcanada-browsers/cft-156.0.8078.4/chrome-linux64/chrome
          ACTIVITY_COUNT_OUTPUT_ROOT: ${{ steps.allocate-output.outputs.artifact_root }}
          ACTIVITY_COUNT_PRIVATE_ROOT: ${{ steps.allocate-output.outputs.private_root }}
          ACTIVITY_COUNT_RUN_ID: ${{ github.run_id }}
          ACTIVITY_COUNT_RUN_ATTEMPT: ${{ github.run_attempt }}
          ACTIVITY_COUNT_CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          timeout --signal=TERM --kill-after=15s 240s node apps/web/e2e/activity-visible-count/run.mjs

      - name: Validate the exact sanitized result
        id: validate-result
        if: always() && steps.allocate-output.outputs.ready == 'true'
        env:
          ACTIVITY_COUNT_OUTPUT_ROOT: ${{ steps.allocate-output.outputs.artifact_root }}
          ACTIVITY_COUNT_RUN_ID: ${{ github.run_id }}
          ACTIVITY_COUNT_RUN_ATTEMPT: ${{ github.run_attempt }}
          ACTIVITY_COUNT_CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node apps/web/e2e/activity-visible-count/run.mjs --validate-output
          printf 'valid=true\n' >> "${GITHUB_OUTPUT}"

      - name: Validate the exact sanitized failure summary
        id: validate-failure-summary
        if: always() && steps.validate-result.outputs.valid == 'true' && steps.validate-result.outputs.failure_summary_required == 'true'
        env:
          ACTIVITY_COUNT_OUTPUT_ROOT: ${{ steps.allocate-output.outputs.artifact_root }}
          ACTIVITY_COUNT_RUN_ID: ${{ github.run_id }}
          ACTIVITY_COUNT_RUN_ATTEMPT: ${{ github.run_attempt }}
          ACTIVITY_COUNT_CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node apps/web/e2e/activity-visible-count/run.mjs --validate-failure-summary
          printf 'valid=true\n' >> "${GITHUB_OUTPUT}"

      - name: Retain only the sanitized failure summary
        if: always() && steps.validate-failure-summary.outputs.valid == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: activity-visible-count-failure-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.allocate-output.outputs.artifact_root }}/failure-summary.json
          if-no-files-found: error

      - name: Retain only the sanitized browser result
        if: always() && steps.validate-result.outputs.valid == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: activity-visible-count-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.allocate-output.outputs.artifact_root }}/result.json
          if-no-files-found: error
