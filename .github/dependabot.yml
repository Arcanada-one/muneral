# Managed by SEC-0034. Directories are derived from the repository tree,
# not templated — a config naming absent paths silently updates nothing.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Grouped so routine upkeep arrives as few reviewable PRs, while
      # majors stay separate — a batched major bump hides breakage.
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/apps/api"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Grouped so routine upkeep arrives as few reviewable PRs, while
      # majors stay separate — a batched major bump hides breakage.
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Grouped so routine upkeep arrives as few reviewable PRs, while
      # majors stay separate — a batched major bump hides breakage.
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/packages/types"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Grouped so routine upkeep arrives as few reviewable PRs, while
      # majors stay separate — a batched major bump hides breakage.
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Grouped so routine upkeep arrives as few reviewable PRs, while
      # majors stay separate — a batched major bump hides breakage.
      minor-and-patch:
        update-types: ["minor", "patch"]
