version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: "docker"
    directory: "/apps/api"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Base images are where OS-level CVEs accumulate, and a digest-pinned FROM
    # cannot rot visibly -- nobody reads a sha256 and notices it is a year old.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
